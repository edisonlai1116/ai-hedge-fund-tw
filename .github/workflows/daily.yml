name: Daily Report (每日最該買 · 免 Key)

# 每天自動產生「每日最該買」報告並 commit 進 docs/data/，
# GitHub Pages（main 分支 /docs 資料夾）會自動更新，開網頁即看。
on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 隔日 06:30 台北（盤前；含前一日美股收盤資料）
    - cron: "0 9 * * *"     # 09:00 UTC = 17:00 台北（台股收盤後，刷新台股持股）
  workflow_dispatch: {}      # 也可在 Actions 頁面手動觸發

# 讓 workflow 能把報告 commit 回 repo
permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps (免 Key pipeline)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance feedparser requests pandas numpy beautifulsoup4 lxml youtube-transcript-api

      - name: Generate daily report
        run: python -m src.pipeline.daily_report

      # 收盤後買賣提醒（持股 加碼/減碼/出場 + 點火買點）；推播設定見 alerts.yml。
      # 失敗不影響每日報告 commit。日誌公開，程式在 CI 中不會印出持股內容。
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Send trade alerts
        continue-on-error: true
        env:
          HOLDINGS: ${{ secrets.HOLDINGS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m src.pipeline.alerts --market all

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}

      - name: Commit updated report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(daily): 每日報告 $(date -u +%Y-%m-%d)"
            git push
          fi
