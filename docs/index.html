<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 科技股動能策略 · 本月名單</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3340;
    --text:#e6edf3; --muted:#8b97a5; --accent:#58a6ff;
    --bull:#2ea043; --bull-bg:#10311a; --bear:#f85149; --bear-bg:#3a1414; --hold:#58a6ff; --hold-bg:#0f2540;
  }
  *{box-sizing:border-box}
  body{margin:0 auto;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.5;padding:16px;max-width:960px}
  h1{font-size:1.35rem;margin:.2em 0}
  a{color:var(--accent)}
  .muted{color:var(--muted);font-size:.85rem}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .spacer{flex:1}
  .tabs button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:700}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:600}
  .buy{color:var(--bull);background:var(--bull-bg)} .hold{color:var(--hold);background:var(--hold-bg)} .fire{color:#e3b341;background:#2e2410}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--border)}
  th:nth-child(2),td:nth-child(2){text-align:left}
  th{color:var(--muted);font-weight:600;font-size:.78rem}
  .up{color:var(--bull)} .down{color:var(--bear)}
  .wrap{overflow-x:auto}
  @media (max-width:600px){ .hide-sm{display:none} }
</style>
</head>
<body>
  <h1>AI 科技股動能策略 · 本月名單</h1>
  <div class="muted" id="meta">讀取中…</div>

  <div class="panel">
    <div class="row">
      <div class="tabs row" id="tabs">
        <button data-m="us" class="on">美股</button>
        <button data-m="tw">台股</button>
      </div>
      <span class="spacer"></span>
      <span class="muted" id="rule"></span>
    </div>
  </div>

  <div class="panel">
    <strong id="buy-title">買進區</strong>
    <div class="wrap"><table><thead><tr>
      <th>排名</th><th>標的</th><th>現價</th><th>近 6 月</th><th class="hide-sm">近 1 月</th><th class="hide-sm">年化波動</th><th>分數</th>
    </tr></thead><tbody id="buy"></tbody></table></div>
  </div>

  <div class="panel">
    <strong id="hold-title">續抱區</strong>
    <div class="muted">已持有可續抱、不新買；跌出此區才在月初賣出換股。</div>
    <div class="wrap"><table><thead><tr>
      <th>排名</th><th>標的</th><th>現價</th><th>近 6 月</th><th class="hide-sm">近 1 月</th><th class="hide-sm">年化波動</th><th>分數</th>
    </tr></thead><tbody id="hold"></tbody></table></div>
  </div>

  <p class="muted">
    完整功能（我的持股提醒、個股查詢、回測對標 VOO／0050）請用 <a href="/">儀表板主頁</a>。
    規則化訊號，回測有倖存者偏差，非投資建議。
  </p>

<script>
let DATA = null, MARKET = "us";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null ? "—" : `<span class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : ""}${Number(v).toFixed(0)}%</span>`;
function rows(list){
  return list.map(r => `<tr>
    <td>${r.rank}</td>
    <td><b>${esc(r.symbol.replace(/\.TWO?$/, ""))}</b> <span class="muted">${esc(r.name || "")}</span>
      ${r.ignition ? `<span class="badge fire">🔥 點火 +${r.ignition.ignition_gain_pct}%</span>` : ""}</td>
    <td>${r.close}</td><td>${pct(r.ret_6m_pct)}</td><td class="hide-sm">${pct(r.ret_1m_pct)}</td>
    <td class="hide-sm">${Number(r.vol_ann_pct).toFixed(0)}%</td><td>${Number(r.score).toFixed(2)}</td></tr>`).join("");
}
function render(){
  const m = DATA.markets[MARKET]; if(!m) return;
  const top = m.top_n || 10, keep = m.keep_n || 30;
  document.getElementById("buy-title").innerHTML = `買進區 · 前 ${top} 名 <span class="badge buy">等權持有</span>`;
  document.getElementById("hold-title").innerHTML = `續抱區 · 第 ${top + 1}~${keep} 名 <span class="badge hold">不新買</span>`;
  document.getElementById("buy").innerHTML = rows(m.rows.slice(0, top));
  document.getElementById("hold").innerHTML = rows(m.rows.slice(top, keep));
  document.getElementById("rule").textContent = `股票池 ${m.universe_size} 檔`;
}
document.getElementById("tabs").addEventListener("click", e => {
  const m = e.target.dataset.m; if(!m) return;
  MARKET = m; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === m)); render();
});
fetch("data/strategy.json?_=" + Date.now()).then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById("meta").textContent =
    `排名更新：${d.generated_at.replace("T", " ").slice(0, 16)} ・ 下次月調：${d.strategy.next_rebalance} ・ ${d.strategy.rule}`;
  render();
}).catch(() => { document.getElementById("meta").textContent = "讀取策略排名失敗。"; });
</script>
</body>
</html>
